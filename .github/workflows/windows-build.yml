name: Windows bundle

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # Nightly at 02:17 UTC; the job skips itself when main has not changed.
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: write

jobs:
  check-main:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
    steps:
      - name: Check for changes since the last Windows build
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-build.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });

            const lastSuccessfulRun = data.workflow_runs[0];
            const isReleaseTag = context.ref.startsWith('refs/tags/');
            const needsBuild = isReleaseTag || !lastSuccessfulRun ||
              lastSuccessfulRun.head_sha !== context.sha;

            core.setOutput('needs_build', String(needsBuild));
            core.info(lastSuccessfulRun
              ? `Last successful Windows build: ${lastSuccessfulRun.head_sha}`
              : 'No successful Windows build found');
            core.info(`Current main commit: ${context.sha}`);
            core.info(`Release tag: ${isReleaseTag}`);
            core.info(`Windows build required: ${needsBuild}`);

  build-windows:
    needs: check-main
    if: needs.check-main.outputs.needs_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable executable
        shell: pwsh
        run: .\builds\windows\build.ps1
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: JS8Mail-windows-x64
          path: builds/windows/dist/JS8Mail.exe
          if-no-files-found: error

  publish-release:
    name: Publish tagged Windows release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: JS8Mail-windows-x64
          path: dist
      - name: Package release asset
        shell: bash
        run: zip -j "JS8Mail-${GITHUB_REF_NAME}-windows-x64.zip" dist/JS8Mail.exe
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: JS8Mail-${{ github.ref_name }}-windows-x64.zip
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JS8Mail $TAG" \
              --generate-notes \
              --prerelease
          else
            gh release upload "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi
